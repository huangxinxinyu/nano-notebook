services:
  nginx:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-nginx:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  control-plane:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-control-plane:${IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: true
    environment:
      NANO_CONTROL_PLANE_ADDR: ":8080"
      NANO_DATABASE_URL: postgres://nano:nano@postgres:5432/nano?sslmode=disable
      NANO_WORKER_URL: http://worker:8081
      NANO_WEB_READER_URL: http://web-reader:8085
      NANO_WEB_READER_SERVICE_TOKEN: nano-prod-reader-token
      NANO_DOCUMENT_RENDERER_URL: http://document-renderer:8084
      NANO_WEB_BASE_URL: http://${NANO_PUBLIC_HOST}
      NANO_COLLECTOR_URL: http://collector:8082
      NANO_COLLECTOR_QUERY_TOKEN: nano-prod-collector-query-token
      NANO_AGENT_TRACE_KAFKA_BROKERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      NANO_AGENT_TRACE_KAFKA_TOPIC: nano.observability.agent-trace.v1
      NANO_AGENT_TRACE_KAFKA_CLIENT_ID: nano-control-plane-agent-trace
      NANO_BIFROST_URL: http://bifrost:56666
      NANO_QDRANT_COLLECTION: nano-source-evidence-gemini-2-768-v1
      NANO_QDRANT_DENSE_DIMENSIONS: "768"
      NANO_QDRANT_URL: http://qdrant:6333
      NANO_SOURCE_S3_ENDPOINT: ${NANO_PUBLIC_HOST}:9000
      NANO_SOURCE_S3_ACCESS_KEY_ID: nano
      NANO_SOURCE_S3_SECRET_ACCESS_KEY: nano-password
      NANO_SOURCE_S3_BUCKET: nano-sources
      NANO_SOURCE_S3_USE_TLS: "false"
      NANO_MAIL_SMTP_ADDR: mailpit:1025
      NANO_MAIL_FROM: nano@notebook.local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      web-reader:
        condition: service_started
    restart: unless-stopped

  worker:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-worker:${IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: true
    environment:
      NANO_WORKER_ADDR: ":8081"
      NANO_DATABASE_URL: postgres://nano:nano@postgres:5432/nano?sslmode=disable
      NANO_CONTROL_PLANE_URL: http://control-plane:8080
      NANO_DOCUMENT_RENDERER_URL: http://document-renderer:8084
      NANO_WEB_READER_URL: http://web-reader:8085
      NANO_WEB_READER_SERVICE_TOKEN: nano-prod-reader-token
      NANO_BIFROST_URL: http://bifrost:56666
      NANO_SOURCE_S3_ENDPOINT: minio:9000
      NANO_SOURCE_S3_ACCESS_KEY_ID: nano
      NANO_SOURCE_S3_SECRET_ACCESS_KEY: nano-password
      NANO_SOURCE_S3_BUCKET: nano-sources
      NANO_SOURCE_S3_USE_TLS: "false"
      NANO_RESEARCH_WORKSPACE_S3_ENDPOINT: minio:9000
      NANO_RESEARCH_WORKSPACE_S3_ACCESS_KEY_ID: nano
      NANO_RESEARCH_WORKSPACE_S3_SECRET_ACCESS_KEY: nano-password
      NANO_RESEARCH_WORKSPACE_S3_BUCKET: nano-research-workspaces
      NANO_RESEARCH_WORKSPACE_S3_USE_TLS: "false"
      NANO_TOOL_RESULT_REDIS_URL: redis://:nano-tool-results@tool-result-cache:6379/0
      NANO_QDRANT_COLLECTION: nano-source-evidence-gemini-2-768-v1
      NANO_QDRANT_DENSE_DIMENSIONS: "768"
      NANO_QDRANT_URL: http://qdrant:6333
      NANO_AGENT_TRACE_KAFKA_BROKERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      NANO_AGENT_TRACE_KAFKA_TOPIC: nano.observability.agent-trace.v1
      NANO_AGENT_TRACE_KAFKA_CLIENT_ID: nano-worker-agent-trace
      NANO_AGENT_TRACE_KAFKA_PURGE_TOPIC: nano.observability.agent-trace-purge.v1
      NANO_AGENT_TRACE_KAFKA_PURGE_CLIENT_ID: nano-worker-agent-trace-purge
      NANO_REPLAY_STAGING_S3_ENDPOINT: minio:9000
      NANO_REPLAY_STAGING_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_STAGING_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_STAGING_S3_BUCKET: nano-agent-replay-staging
      NANO_REPLAY_S3_ENDPOINT: minio:9000
      NANO_REPLAY_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_S3_BUCKET: nano-agent-replay
      NANO_REPLAY_KEY_ID: nano-prod-replay-key-v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      tool-result-cache:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      web-reader:
        condition: service_started
    restart: unless-stopped

  tool-result-cache:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "nano-tool-results", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a nano-tool-results ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  collector:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-collector:${IMAGE_TAG:-latest}
    environment:
      NANO_COLLECTOR_ADDR: ":8082"
      NANO_COLLECTOR_SERVICE_TOKEN: nano-prod-collector-token
      NANO_COLLECTOR_QUERY_TOKEN: nano-prod-collector-query-token
      NANO_COLLECTOR_PRODUCER_ID: nano-worker
      NANO_CLICKHOUSE_ADDR: clickhouse:9000
      NANO_CLICKHOUSE_DATABASE: nano_observability
      NANO_CLICKHOUSE_USER: nano_observability
      NANO_CLICKHOUSE_PASSWORD: nano-observability
      NANO_REPLAY_STAGING_S3_ENDPOINT: minio:9000
      NANO_REPLAY_STAGING_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_STAGING_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_STAGING_S3_BUCKET: nano-agent-replay-staging
      NANO_REPLAY_S3_ENDPOINT: minio:9000
      NANO_REPLAY_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_S3_BUCKET: nano-agent-replay
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/internal/agent-observability/v1/health >/dev/null && wget -qO- http://127.0.0.1:9093/metrics >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  agent-trace-processor-clickhouse:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-agent-trace-processor:${IMAGE_TAG:-latest}
    environment:
      NANO_CLICKHOUSE_ADDR: clickhouse:9000
      NANO_CLICKHOUSE_DATABASE: nano_observability
      NANO_CLICKHOUSE_USER: nano_observability
      NANO_CLICKHOUSE_PASSWORD: nano-observability
      NANO_KAFKA_BROKERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      NANO_AGENT_TRACE_TOPIC: nano.observability.agent-trace.v1
      NANO_AGENT_TRACE_PURGE_TOPIC: nano.observability.agent-trace-purge.v1
      NANO_AGENT_TRACE_PROCESSOR_GROUP_ID: nano-agent-trace-storage-clickhouse-v1
      NANO_REPLAY_STAGING_S3_ENDPOINT: minio:9000
      NANO_REPLAY_STAGING_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_STAGING_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_STAGING_S3_BUCKET: nano-agent-replay-staging
      NANO_REPLAY_S3_ENDPOINT: minio:9000
      NANO_REPLAY_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_S3_BUCKET: nano-agent-replay
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9096/metrics >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  document-renderer:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-document-renderer:${IMAGE_TAG:-latest}
    environment:
      NANO_DOCUMENT_RENDERER_ADDR: ":8084"
      NANO_DOCUMENT_RENDERER_SERVICE_TOKEN: nano-prod-renderer-token
      NANO_DOCUMENT_RENDER_CONFIG_ID: pdfium-libreoffice-v1
      NANO_DOCUMENT_RENDERER_MAX_CONCURRENT: "2"
    read_only: true
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1536m
    cpus: 2.0
    restart: unless-stopped

  web-reader:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-web-reader:${IMAGE_TAG:-latest}
    environment:
      NANO_WEB_READER_ADDR: ":8085"
      NANO_WEB_READER_SERVICE_TOKEN: nano-prod-reader-token
      NANO_WEB_READER_ENGINE: "auto"
      NANO_WEB_READER_MAX_CONCURRENT: "8"
      NANO_WEB_READER_BROWSER_MAX_CONCURRENT: "4"
      NANO_WEB_READER_BROWSER_EXECUTABLE: /usr/bin/chromium
    read_only: true
    tmpfs:
      # Chromium keeps its profile and cache under HOME=/tmp.
      - /tmp:size=536870912,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Chromium spawns a browser + renderer + utility process cluster, so the
    # sidecar needs a higher pid ceiling than the Go sidecars.
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nano
      POSTGRES_PASSWORD: nano
      POSTGRES_DB: nano
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nano -d nano"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  kafka-1:
    image: apache/kafka:4.3.1
    hostname: kafka-1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:4.3.1
    hostname: kafka-2
    environment:
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kafka-3:
    image: apache/kafka:4.3.1
    hostname: kafka-3
    environment:
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      NANO_KAFKA_BOOTSTRAP_SERVER: kafka-1:19092,kafka-2:19092,kafka-3:19092
      NANO_KAFKA_REPLICATION_FACTOR: "3"
      NANO_KAFKA_MIN_INSYNC_REPLICAS: "2"
    entrypoint: ["/bin/bash", "/opt/nano/init-topics.sh"]
    volumes:
      - ../kafka/init-topics.sh:/opt/nano/init-topics.sh:ro

  clickhouse:
    image: clickhouse:26.3.17.56-jammy
    environment:
      CLICKHOUSE_DB: nano_observability
      CLICKHOUSE_USER: nano_observability
      CLICKHOUSE_PASSWORD: nano-observability
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host 127.0.0.1 --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: nano
      MINIO_ROOT_PASSWORD: nano-password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 nano nano-password
        mc mb --ignore-existing local/nano-agent-replay-staging
        mc mb --ignore-existing local/nano-agent-replay
        mc mb --ignore-existing local/nano-sources
        mc mb --ignore-existing local/nano-research-workspaces

  qdrant:
    image: qdrant/qdrant:v1.15.1
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  bifrost:
    image: maximhq/bifrost:v1.6.3
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "56666"
      LOG_LEVEL: info
      LOG_STYLE: json
    volumes:
      - ../bifrost:/app/data
      # Production reaches DashScope through its international endpoint.
      - ../bifrost/config.prod.json:/app/data/config.json:ro
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ../observability/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    # Operator-only: bound to loopback, not exposed through nginx (PRD
    # criterion 2). Reach it via an SSH tunnel or bastion, same as the
    # infra services above that have no `ports:` entry at all.
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${NANO_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${NANO_GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  clickhouse-data:
  minio-data:
  qdrant-data:
  prometheus-data:
  grafana-data:
